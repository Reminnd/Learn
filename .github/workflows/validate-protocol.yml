name: Validate protocol

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate_protocol.py

  stage-01-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r environment/requirements-stage-01.txt
      - run: python scripts/preflight.py
      - run: python examples/stage-01/ex1_message_prompt_langchain.py
