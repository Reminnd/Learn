version: 2
backend: git_repository
backend_root: github://Reminnd/Learn@main
capabilities:
  persistent_read: true
  persistent_write: true
  local_path_exposed: false
  user_browsable: true
  versioned: true
paths:
  state.current: .learn-agent/progress/current.md
  notes.root: learning/notes
  notes.index: learning/notes/index.md
  qa.stage: learning/qa/stage-01.md
  bugs.book: learning/bug-book/bug-book.md
  progress.code_ability: learning/progress/code-ability.md
  project.root: learning/project
  adr.root: learning/adr
persistence:
  checkpoint_batching:
    enabled: true
    max_checkpoints: 3
    volatile_until_flush: true
    checkpoint_version_mode: advance_by_buffered_count
    session_access_mode: cache_until_flush
    normal_buffered_turn_remote_reads: 0
    normal_buffered_turn_remote_writes: 0
    refresh_before_each_turn: false
    flush_on:
      - needs_review
      - section_boundary
      - chapter_boundary
      - mastery_sensitive
      - pause_or_stop
      - completion
      - conversation_handoff
      - explicit_checkpoint
    refresh_on:
      - flush_conflict
      - unknown_write_outcome
      - recovery
      - integrity_reconstruction
      - mastery_requires_unloaded_evidence
sync_targets: []
backend_id: learn-agent-github-main
